 <body>
     <div class="container">
         <h1>📺 Photo/Video Broadcast</h1>
 
         <div class="admin-section">
             <h2>Admin Panel - Upload Media</h2>
             <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                 <p>Click to upload or drag and drop</p>
                 <p style="font-size: 12px; color: #999;">Photos or Videos</p>
                 <button class="upload-btn">Choose File</button>
             </div>
             <input type="file" id="fileInput" accept="image/*,video/*">
             <div id="uploadStatus"></div>
         </div>
 
         <div class="broadcast-section">
             <h2>📡 Live Broadcast</h2>
             <div id="mediaDisplay">
                 <p class="no-media">Waiting for content...</p>
             </div>
             <div class="viewer-count">
                 Viewers connected: <span id="viewerCount">0</span>
             </div>
             <div id="status" class="status disconnected">Disconnected</div>
         </div>
     </div>
 
     <script>
         const isAdmin = true; // Set admin credentials
         let socket;
         let mediaData = null;
 
         // Initialize WebSocket connection
         function initWebSocket() {
             socket = new WebSocket('ws://localhost:8080');
 
             socket.onopen = () => {
                 console.log('Connected to server');
                 updateStatus(true);
                 socket.send(JSON.stringify({ type: 'admin-check', isAdmin }));
             };
 
             socket.onmessage = (event) => {
                 const message = JSON.parse(event.data);
 
                 if (message.type === 'media-update') {
                     displayMedia(message.data);
                 }
 
                 if (message.type === 'viewer-count') {
                     document.getElementById('viewerCount').textContent = message.count;
                 }
             };
 
             socket.onclose = () => {
                 console.log('Disconnected from server');
                 updateStatus(false);
                 setTimeout(initWebSocket, 3000);
             };
 
             socket.onerror = (error) => {
                 console.error('WebSocket error:', error);
                 updateStatus(false);
             };
         }
 
         // Handle file upload
         document.getElementById('fileInput').addEventListener('change', (e) => {
             const file = e.target.files[0];
             if (!file) return;
 
             const reader = new FileReader();
             reader.onload = (event) => {
                 mediaData = {
                     data: event.target.result,
                     type: file.type,
                     name: file.name
                 };
 
                 displayMedia(mediaData);
 
                 // Broadcast to all connected clients
                 if (socket && socket.readyState === WebSocket.OPEN) {
                     socket.send(JSON.stringify({
                         type: 'media-upload',
                         media: mediaData
                     }));
                 }
 
                 document.getElementById('uploadStatus').innerHTML = `<div class="status connected">✓ Media uploaded: ${file.name}</div>`;
                 setTimeout(() => {
                     document.getElementById('uploadStatus').innerHTML = '';
                 }, 3000);
             };
 
             reader.readAsDataURL(file);
         });
 
         // Display media in broadcast area
         function displayMedia(media) {
             const display = document.getElementById('mediaDisplay');
             display.innerHTML = '';
 
             if (media.type.startsWith('image')) {
                 const img = document.createElement('img');
                 img.src = media.data;
                 display.appendChild(img);
             } else if (media.type.startsWith('video')) {
                 const video = document.createElement('video');
                 video.src = media.data;
                 video.controls = true;
                 video.autoplay = true;
                 display.appendChild(video);
             }
         }
 
         // Update connection status
         function updateStatus(connected) {
             const status = document.getElementById('status');
             if (connected) {
                 status.textContent = '✓ Connected';
                 status.className = 'status connected';
             } else {
                 status.textContent = '✗ Disconnected';
                 status.className = 'status disconnected';
             }
         }
 
         // Fallback: Use localStorage and periodic polling if WebSocket isn't available
         let lastUpdate = 0;
 
         function pollMedia() {
             const stored = localStorage.getItem('broadcastMedia');
             if (stored) {
                 const media = JSON.parse(stored);
                 if (media.timestamp > lastUpdate) {
                     lastUpdate = media.timestamp;
                     displayMedia(media);
                 }
             }
         }
 
         // Initialize with WebSocket (production ready with server)
         // For demo purposes, use localStorage
         document.getElementById('fileInput').addEventListener('change', (e) => {
             const file = e.target.files[0];
             if (!file) return;
 
             const reader = new FileReader();
             reader.onload = (event) => {
                 const media = {
                     data: event.target.result,
                     type: file.type,
                     name: file.name,
                     timestamp: Date.now()
                 };
 
                 // Store in localStorage for other tabs/windows
                 localStorage.setItem('broadcastMedia', JSON.stringify(media));
                 displayMedia(media);
 
                 document.getElementById('uploadStatus').innerHTML = `<div class="status connected">✓ Media broadcasted: ${file.name}</div>`;
                 setTimeout(() => {
                     document.getElementById('uploadStatus').innerHTML = '';
                 }, 3000);
             };
 
             reader.readAsDataURL(file);
         });
 
         // Poll for updates from other tabs
         setInterval(pollMedia, 500);
         pollMedia();
 
         // Update viewer count in localStorage
         function updateViewerCount() {
             let count = parseInt(localStorage.getItem('viewerCount') || '0') + 1;
             localStorage.setItem('viewerCount', count);
             document.getElementById('viewerCount').textContent = count;
         }
 
         updateViewerCount();
 
         // Reset viewer count when page closes
         window.addEventListener('beforeunload', () => {
             let count = Math.max(0, parseInt(localStorage.getItem('viewerCount') || '1') - 1);
             localStorage.setItem('viewerCount', count);
         });
 
         updateStatus(true);
     </script>
 </body>
